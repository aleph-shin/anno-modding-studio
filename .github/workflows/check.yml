# The check a change is held to: tools/check.py, on Windows, on the oldest
# Python the Studio supports and the newest it is tried on.
#
# CI has neither game nor the loader. The tests that need them skip here, and
# the job's summary lists them; docs/development.md, "CI", says what this
# cannot check and who does instead. A workflow that builds the release on a
# tag goes in a file of its own beside this one, with its own permissions.
name: check

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR replaces the run of the older one. A push to main or a
# release branch runs to the end, so every commit there has a result.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check.py on Python ${{ matrix.python }}
    # While the repository is private its Actions minutes are few, and one
    # run of both jobs is reckoned at about 80 of them (Windows counts
    # double), so it runs there only when asked for from the Actions tab.
    # Public, it is free and runs on everything above.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The recorded counts are compared with the main branch's, where
          # this branch left it, which needs the history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e ".[dev]"
          python -c "import sys, PySide6, lxml.etree as e; print(sys.version); print('PySide6', PySide6.__version__, '- lxml', e.__version__)"

      - name: tools/check.py --ci
        timeout-minutes: 45
        env:
          # What the suite prints is UTF-8, whatever the runner's code page,
          # and reaches the log as it is printed rather than in blocks.
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python tools/check.py --ci
