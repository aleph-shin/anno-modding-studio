# The PR's description has what docs/standards/pr-checklist.md asks for:
# tools/pr_description.py, on every PR and again on every edit of its
# description, so a description put right passes without a new push.
#
# The description is handed over in an environment variable, never written
# into the script, so nothing in it is run.
name: pr-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: The description has what the template asks for
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tools/pr_description.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 tools/pr_description.py
